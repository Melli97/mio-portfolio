backend:
  name: git-gateway
  branch: main

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "progetti"
    label: "Progetti"
    folder: "src/content/progetti"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titolo", name: "titolo", widget: "string" }
      - { label: "Descrizione", name: "descrizione", widget: "text" }
      - { label: "Repository GitHub", name: "github", widget: "string", required: false }
      - { label: "Live Demo / Link", name: "link", widget: "string", required: false }
      - { label: "Tags (separati da virgola)", name: "tags", widget: "string" }